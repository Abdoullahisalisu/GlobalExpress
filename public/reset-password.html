<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password - GE DATA</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f7fb;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .resetBox {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        .logo {
            width: 70px;
            height: 70px;
            display: block;
            margin: 0 auto 15px;
        }

        h2 {
            text-align: center;
            margin-bottom: 8px;
        }

        p {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 10px;
            margin-bottom: 15px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
        }

        button {
            width: 100%;
            border: none;
            padding: 14px;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="resetBox">

    <img src="logo.png" class="logo" alt="GE DATA">

    <h2>Reset Password</h2>

    <p>Create a new password for your GE DATA account.</p>

    <form id="resetForm">

        <input
            type="password"
            id="newPassword"
            placeholder="New password"
            minlength="6"
            required
        >

        <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm new password"
            minlength="6"
            required
        >

        <button type="submit" id="resetBtn">
            Reset Password
        </button>

    </form>

    <div id="message"></div>

</div>

<script src="reset-password.js"></script>

</body>
</html>
